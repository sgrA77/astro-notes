name: Space data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Fetch
        run: python ASTRO_FETCH.py
      - name: Publish to data branch
        run: |
          cp space.json "$RUNNER_TEMP/sp.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan data
          git rm -rfq . 2>/dev/null || true
          cp "$RUNNER_TEMP/sp.json" space.json
          git add space.json
          git commit -qm "space $(date -u +%FT%TZ)"
          git push -f origin data
